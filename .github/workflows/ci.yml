name: DevOrbit Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    env:
      CI: 'true'
      NODE_ENV: 'test'
      DATABASE_URL: 'file:./ci-test.db'
      JWT_SECRET: 'ci_test_super_secret_jwt_key_at_least_32_chars_long_012345'
      GITHUB_TOKEN_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      PORT: '3001'
      CORS_ORIGIN: 'http://localhost:5173'
      VITE_API_URL: 'http://localhost:3001'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Monorepo Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Configure Environment Files
        run: |
          cp .env.example .env
          cp apps/api/.env.example apps/api/.env
          echo "DATABASE_URL=\"file:${{ github.workspace }}/ci-test.db\"" >> .env
          echo "DATABASE_URL=\"file:${{ github.workspace }}/ci-test.db\"" >> apps/api/.env

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "file:${{ github.workspace }}/ci-test.db"
        run: npm run db:generate

      - name: Prepare Isolated CI Database Schema
        env:
          DATABASE_URL: "file:${{ github.workspace }}/ci-test.db"
        run: |
          npm run db:push -- --accept-data-loss
          npm run db:seed

      - name: Run TypeScript Type Checks
        run: |
          npx tsc --noEmit --project apps/api/tsconfig.json
          npx tsc --noEmit --project apps/web/tsconfig.json

      - name: Run Backend Tests (API Unit & Integration Suite)
        env:
          DATABASE_URL: "file:${{ github.workspace }}/ci-test.db"
          NODE_ENV: "test"
        run: npm run test:api

      - name: Run Frontend Tests (UI & Contract Conformance Suite)
        env:
          NODE_ENV: "test"
        run: npm run test:web

      - name: Build Complete Monorepo (Web & API)
        run: npm run build

      - name: Verify Production Build Artifacts
        run: |
          test -f apps/web/dist/index.html || { echo "apps/web/dist/index.html is missing!"; exit 1; }
          test -f apps/api/dist/server.js || { echo "apps/api/dist/server.js is missing!"; exit 1; }
          echo "Production build verified: web index.html and api server.js exist."
